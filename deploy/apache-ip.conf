# ============================================================================
# Apache — site dedicado, acessível pelo IP do servidor (http://IP-DO-SERVIDOR/)
#
# Debian/Ubuntu:
#   sudo cp deploy/apache-ip.conf /etc/apache2/sites-available/rotina.conf
#   (edite o caminho abaixo se não for /var/www/rotina)
#   sudo a2enmod headers
#   sudo a2dissite 000-default      # só se este for o ÚNICO site do servidor
#   sudo a2ensite rotina && sudo systemctl reload apache2
#
# RHEL/Rocky/Alma: coloque em /etc/httpd/conf.d/rotina.conf e: systemctl reload httpd
#
# Sem ServerName: responde a QUALQUER endereço (IP, nome da máquina, domínio) na porta 80.
# Para usar outra porta (ex.: 8080), troque *:80 e adicione "Listen 8080" em ports.conf.
# ============================================================================
<VirtualHost *:80>
    DocumentRoot /var/www/rotina/public

    <Directory /var/www/rotina/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

        # AllowOverride All lê public/.htaccess (cabeçalhos de segurança)
    # Defesa extra: mesmo que .htaccess seja ignorado, estas pastas nunca são servidas
    # (elas já ficam FORA do DocumentRoot).
    ErrorLog  ${APACHE_LOG_DIR}/rotina-error.log
    CustomLog ${APACHE_LOG_DIR}/rotina-access.log combined
</VirtualHost>
