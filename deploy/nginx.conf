# ============================================================================
# Nginx + PHP-FPM — acessível pelo IP do servidor (http://IP-DO-SERVIDOR/)
#
# Debian/Ubuntu:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rotina
#   sudo ln -s /etc/nginx/sites-available/rotina /etc/nginx/sites-enabled/rotina
#   (ajuste "root" e o socket do PHP-FPM: ls /run/php/)   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANTE: no Nginx o arquivo .htaccess NÃO funciona. Os cabeçalhos de segurança estão aqui.
# ============================================================================
server {
    listen 80 default_server;
    server_name _;                         # qualquer IP/nome

    root /var/www/rotina/public;           # SOMENTE a pasta public/ é exposta
    index index.html;

    client_max_body_size 12m;              # importação de planilhas grandes (sync aceita até 10 MB)

    # --- segurança ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ /\. { deny all; }           # .htaccess, .git etc.

    location = / { try_files /index.html =404; }

    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache" always;
        # (repita os add_header acima: o Nginx não herda cabeçalhos quando um location define algum)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Só api.php e install.php executam PHP; qualquer outro .php dá 404
    location ~ ^/(api|install)\.php$ {
        include snippets/fastcgi-php.conf;                 # RHEL: troque por "include fastcgi_params;" + fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;           # ou 127.0.0.1:9000 / /run/php/php8.3-fpm.sock
        fastcgi_read_timeout 300;
    }
    location ~ \.php$ { return 404; }
}
