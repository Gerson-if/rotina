# ============================================================================
# Apache — o sistema em um SUBCAMINHO de um site que já existe:  http://IP-DO-SERVIDOR/rotina/
# Não mexe no site atual. Inclua dentro do <VirtualHost> existente OU use como conf avulsa:
#   Debian/Ubuntu:  sudo cp deploy/apache-subpasta.conf /etc/apache2/conf-available/rotina.conf
#                   sudo a2enmod headers && sudo a2enconf rotina && sudo systemctl reload apache2
# ============================================================================
Alias /rotina /var/www/rotina/public

<Directory /var/www/rotina/public>
    AllowOverride All
    Require all granted
    Options -Indexes
</Directory>
